name: review-gate-selftest

# Decision-logic unit tests for the pure-Python helpers in .github/scripts/.
# The step below runs `unittest discover` over that whole directory, so every
# `test_*.py` there is covered; the path triggers just decide when to bother.
# Currently: the review gate (a merge control hand-ported from JavaScript, so
# its logic is pinned against translation slips) and the buildcache freshness
# gate (whose bug mode is reporting a stale cache as fresh, which reinstates the
# silent failure it exists to catch).
#
# These tests run in their OWN workflow, separate from review-gate.yml, for a
# reason learned the hard way: when the self-test ran as a step inside the gate
# job, a self-test failure aborted the job before any commit status was posted
# -- and a gate that posts nothing on failure recreates the silent hole it
# exists to close.
#
# Unlike the gate, this runs from the PULL REQUEST's code, because the point is
# to validate the proposed change to the checker. It is a plain `pull_request`
# (not `pull_request_target`) with read-only permissions and no secrets, so
# executing PR-authored code here carries no write-scoped credentials.

on:
  pull_request:
    paths:
      - '.github/scripts/require-ally-review.py'
      - '.github/scripts/test_require_ally_review.py'
      - '.github/scripts/buildcache_freshness.py'
      - '.github/scripts/test_buildcache_freshness.py'
      - '.github/workflows/review-gate.yml'
      - '.github/workflows/review-gate-selftest.yml'
      # The buildcache tests assert the seeder's build matrix stays in lockstep
      # with github-ci.yml's. A drift PR may touch ONLY these two workflows, so
      # without them here the assertion that guards them never runs.
      - '.github/workflows/buildcache-seed.yml'
      - '.github/workflows/github-ci.yml'
  push:
    branches:
      # Both fleet default branches: frr uses master, but this file is
      # vendored byte-identically into repos whose default is main, where a
      # master-only trigger silently never runs the post-merge self-test.
      - master
      - main
    paths:
      - '.github/scripts/require-ally-review.py'
      - '.github/scripts/test_require_ally_review.py'
      - '.github/scripts/buildcache_freshness.py'
      - '.github/scripts/test_buildcache_freshness.py'
      - '.github/workflows/buildcache-seed.yml'
      - '.github/workflows/github-ci.yml'

permissions:
  contents: read

jobs:
  selftest:
    name: Review gate self-test
    runs-on: arc-light
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run gate decision-logic tests
        # -v so a regression names the exact protected branch it broke.
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

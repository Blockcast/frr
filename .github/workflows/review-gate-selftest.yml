name: review-gate-selftest

# Decision-logic unit tests for the pure-Python helpers in .github/scripts/.
# The step below runs `unittest discover` over that whole directory, so every
# `test_*.py` there is covered; the path triggers just decide when to bother.
# Currently: the review gate (a merge control hand-ported from JavaScript, so
# its logic is pinned against translation slips) and the buildcache freshness
# gate (whose bug mode is reporting a stale cache as fresh, which reinstates the
# silent failure it exists to catch).
#
# These tests run in their OWN workflow, separate from review-gate.yml, for a
# reason learned the hard way: when the self-test ran as a step inside the gate
# job, a self-test failure aborted the job before any commit status was posted
# -- and a gate that posts nothing on failure recreates the silent hole it
# exists to close.
#
# Unlike the gate, this runs from the PULL REQUEST's code, because the point is
# to validate the proposed change to the checker. It is a plain `pull_request`
# (not `pull_request_target`), and the lookup step below does hand PR-authored
# code a credential: the job's `github.token`, capped by the workflow-level
# `permissions: contents: read`. That cap is the whole safety argument, so it
# must NOT be widened while this job runs PR code -- in particular, do not add
# `administration: read` to fix a 403 on the collaborator-permission lookup.

on:
  pull_request:
    paths:
      - '.github/scripts/require-ally-review.py'
      - '.github/scripts/test_require_ally_review.py'
      - '.github/scripts/buildcache_freshness.py'
      - '.github/scripts/test_buildcache_freshness.py'
      - '.github/workflows/review-gate.yml'
      - '.github/workflows/review-gate-selftest.yml'
      # The buildcache tests assert the seeder's build matrix stays in lockstep
      # with github-ci.yml's. A drift PR may touch ONLY these two workflows, so
      # without them here the assertion that guards them never runs.
      - '.github/workflows/buildcache-seed.yml'
      - '.github/workflows/github-ci.yml'
  push:
    branches:
      # Both fleet default branches: frr uses master, but this file is
      # vendored byte-identically into repos whose default is main, where a
      # master-only trigger silently never runs the post-merge self-test.
      - master
      - main
    paths:
      - '.github/scripts/require-ally-review.py'
      - '.github/scripts/test_require_ally_review.py'
      - '.github/scripts/buildcache_freshness.py'
      - '.github/scripts/test_buildcache_freshness.py'
      - '.github/workflows/buildcache-seed.yml'
      - '.github/workflows/github-ci.yml'

permissions:
  contents: read

jobs:
  selftest:
    name: Review gate self-test
    runs-on: arc-light
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure PyYAML
        # discover -p 'test_*.py' sweeps every test_*.py under .github/scripts,
        # which is the point (see the header comment above) but also means a
        # consumer repo that vendors this file byte-identically can have its
        # OWN unrelated test_*.py land in the same discovery path with a
        # dependency this job never installed -- trafficcontrol's
        # test_oidc_resolve_env.py imports PyYAML, which this runner image
        # does not ship by default. Installing it defensively here, rather
        # than narrowing discovery, keeps the broad sweep this job exists for
        # (both the review gate and the buildcache freshness gate) working
        # for every vendored consumer rather than only for frr's own tree.
        # --break-system-packages is required because these images are PEP
        # 668 externally-managed, where a bare `pip install` hard-fails.
        # `python3 -m pip`, not bare `pip`: the guard, the install and the
        # test step below must all resolve the SAME interpreter. On a
        # multi-Python image a PATH `pip` can belong to another one, so the
        # install "succeeds" while python3 still cannot import yaml. Pinned so
        # the gate's own self-test does not pull whatever PyPI serves today.
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.2'
          fi
          python3 -c 'import yaml'

      - name: Run gate decision-logic tests
        # -v so a regression names the exact protected branch it broke.
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Collaborator-permission lookup resolves on the workflow token
        # The gate's only trust signal is GET /repos/{owner}/{repo}/collaborators/{login}/permission
        # on github.token. Exercise the real token/endpoint pair here so a credential that cannot
        # perform the lookup fails this job loudly instead of leaving review/ally-complete pending
        # with no working override. A 404 ("not a collaborator", e.g. a bot actor) is an
        # authoritative answer and passes; 401/403/5xx raise and fail the step.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("gate", ".github/scripts/require-ally-review.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          actor = os.environ["GITHUB_ACTOR"]
          permission = gate.fetch_collaborator_permission(
              os.environ.get("GITHUB_API_URL", "https://api.github.com"),
              owner, repo, actor, os.environ["GITHUB_TOKEN"],
          )
          print("collaborator-permission: %s -> %s" % (actor, permission or "(not a collaborator)"))
          PY

name: github-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'master'
      - 'stable/**'
      - 'rc/**'
      - 'ci/**'

# Cancel older in-progress runs for the same ref to save runners.
#
# This applies to master too, and deliberately so: nothing in this workflow
# writes the buildcache (see the `cache-from` comment on the Build job), so
# cancelling a master run can no longer strand the cache. Do not add a
# `cache-to` here to "make master useful" -- that is precisely the coupling
# that kept the cache stale for 8-18 days at a stretch. Cache writes belong in
# buildcache-seed.yml, which is never cancelled.
concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default GITHUB_TOKEN to read-only repository contents.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Classify changes: doc/ vs everything else (skip Docker build/tests when only doc/ changed).
  doc-path-filter:
    if: ${{ github.event_name != 'pull_request' || github.actor != 'mergify[bot]' }}
    runs-on: default
    name: Documentation path filter
    permissions:
      contents: read
      pull-requests: read
    outputs:
      doc: ${{ steps.filter.outputs.doc }}
      non_doc: ${{ steps.filter.outputs.non_doc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            doc:
              - 'doc/**'
            non_doc:
              - '**'
              - '!doc/**'

  Prepare-MIB-Cache:
    needs: doc-path-filter
    if: ${{ needs.doc-path-filter.outputs.non_doc == 'true' }}
    runs-on: default
    name: Prepare shared MIB cache
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Ensure local MIB cache directory exists
        run: mkdir -p docker/ubuntu-ci/mib-cache
      - name: Restore cached MIB files
        uses: actions/cache@v5
        with:
          path: docker/ubuntu-ci/mib-cache
          key: mib-cache-v1-ubuntu24
      - name: Populate missing MIB cache files
        run: |
          set -euo pipefail
          fetch_to_cache() {
            src_url="$1"
            cache_name="$2"
            dest_path="docker/ubuntu-ci/mib-cache/${cache_name}"
            if [ -s "${dest_path}" ]; then
              echo "Using cached ${cache_name}"
              return 0
            fi
            attempt=1
            max_attempts=8
            while [ "${attempt}" -le "${max_attempts}" ]; do
              wget --tries=1 --timeout=30 --retry-connrefused "${src_url}" -O "${dest_path}.tmp" && mv "${dest_path}.tmp" "${dest_path}" && return 0
              rm -f "${dest_path}.tmp"
              sleep_time=$((attempt * 5))
              echo "Retrying cache fetch (${attempt}/${max_attempts}) for ${cache_name} in ${sleep_time}s" >&2
              sleep "${sleep_time}"
              attempt=$((attempt + 1))
            done
            rm -f "${dest_path}.tmp" "${dest_path}"
            echo "ERROR: Failed to cache ${cache_name} from ${src_url}" >&2
            return 1
          }
          fetch_to_cache https://www.iana.org/assignments/ianasmf-mib/ianasmf-mib IANA-SMF-MIB
          fetch_to_cache https://www.iana.org/assignments/ianaentity-mib/ianaentity-mib IANA-ENTITY-MIB
          fetch_to_cache https://www.iana.org/assignments/ianapowerstateset-mib/ianapowerstateset-mib IANAPowerStateSet-MIB
          fetch_to_cache https://www.iana.org/assignments/ianaolsrv2linkmetrictype-mib/ianaolsrv2linkmetrictype-mib IANA-OLSRv2-LINK-METRIC-TYPE-MIB
          fetch_to_cache https://www.iana.org/assignments/ianaenergyrelation-mib/ianaenergyrelation-mib IANA-ENERGY-RELATION-MIB
          fetch_to_cache https://www.iana.org/assignments/ianabfdtcstd-mib/ianabfdtcstd-mib IANA-BFD-TC-STD-MIB
          fetch_to_cache https://www.iana.org/assignments/ianastoragemediatype-mib/ianastoragemediatype-mib IANA-STORAGE-MEDIA-TYPE-MIB
          fetch_to_cache https://www.ieee802.org/1/files/public/MIBs/IEEE8021-CFM-MIB.mib IEEE8021-CFM-MIB
          fetch_to_cache https://www.ieee802.org/1/files/public/MIBs/LLDP-MIB-200505060000Z.mib LLDP-MIB

  Documentation-HTML:
    needs: doc-path-filter
    if: ${{ needs.doc-path-filter.outputs.doc == 'true' }}
    runs-on: default
    name: HTML documentation (user + developer)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install Sphinx dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-sphinx python3-sphinx-rtd-theme graphviz
      - name: Build HTML documentation
        run: |
          set -euo pipefail
          python3 -m sphinx -b html -d doc/user/_build/.doctrees \
            doc/user doc/user/_build/html
          python3 -m sphinx -b html -d doc/developer/_build/.doctrees \
            doc/developer doc/developer/_build/html
      - name: Stage HTML for artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -a doc/user/_build/html artifact/user
          cp -a doc/developer/_build/html artifact/developer
      - name: Upload HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: artifact/
          retention-days: 14
          if-no-files-found: error

  Build:
    runs-on: default
    needs: Prepare-MIB-Cache
    name: ${{ matrix.cfg.name }}
    # Guardrail in case a build leg hangs.
    #
    # Every run here reads cache and none writes it, so a warm build is fast and
    # 45m is a tight, useful bound on PRs -- it is what surfaced the
    # shared-cache defect instead of hiding it behind a slow green.
    #
    # master keeps more headroom because a merge that changes the Dockerfile's
    # shared layers builds cold here by definition: buildcache-seed.yml has not
    # re-seeded that commit's layers yet (its push trigger runs in parallel with
    # this one, not before it). 90m keeps the merge from failing on a timeout
    # while the cache is catching up.
    timeout-minutes: ${{ github.ref == 'refs/heads/master' && 90 || 45 }}
    strategy:
      # Keep all matrix legs running so we get full failure signal.
      fail-fast: false
      matrix:
        # The distro under test lives in the image, independent of the ARC host OS.
        # The build cache is keyed on `platform`, which is the full build identity
        # (distro + LTTng). There is deliberately no separate cache key: when the
        # two 24.04 legs shared one, each overwrote the other's registry manifest
        # on master and every PR build of the loser missed cache and rebuilt the
        # whole image, blowing the 45m timeout.
        cfg:
        -  { rel: '22.04', name: 'Ubuntu 22.04 amd64 Build',       platform: 'amd64_u22' }
        -  { rel: '24.04', name: 'Ubuntu 24.04 amd64 Build',       platform: 'amd64_u24' }
        -  { rel: '24.04', name: 'Ubuntu 24.04 amd64 LTTng Build', platform: 'amd64_u24_lttng', lttng: 'true' }

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Ensure local MIB cache directory exists
        run: mkdir -p docker/ubuntu-ci/mib-cache
      - name: Restore cached MIB files
        if: ${{ matrix.cfg.rel == '24.04' }}
        uses: actions/cache/restore@v5
        with:
          path: docker/ubuntu-ci/mib-cache
          key: mib-cache-v1-ubuntu24
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build docker image (cached)
        uses: docker/build-push-action@v6
        env:
          # Temporary diagnostic to make Buildx cache behavior visible in job summary.
          DOCKER_BUILD_SUMMARY: true
        with:
          context: .
          file: docker/ubuntu-ci/Dockerfile
          build-args: |
            UBUNTU_VERSION=${{ matrix.cfg.rel }}
            ENABLE_LTTNG=${{ matrix.cfg.lttng || 'false' }}
            FRR_SOURCE_REV=${{ github.sha }}
          # Two exporters, one build:
          #
          #   * the tar, still consumed by the `Test` (arc-e2e) lane, which has
          #     no proven route to registry.blockcast.net -- that reachability
          #     probe is tracked separately on BLO-29817.
          #   * a registry image, consumed by `Unit-Test`. Moving that lane off
          #     Actions artifact storage deletes a 5-43 min variance term that
          #     was consuming 100% of its 20-minute budget (BLO-29817).
          #
          # The tag lives under the same `cache/frr-ci` repository the buildcache
          # already writes (buildcache-seed.yml), so this needs no registry scope
          # that is not already exercised on every master push. The `img-` prefix
          # keeps it out of the `-buildcache` tag namespace that
          # buildcache_freshness.py asserts on.
          #
          # Each exporter carries its OWN name, and there is deliberately no
          # `tags:` input. `tags:` becomes a global `--tag`, which buildx applies
          # to *every* exporter -- so with two exporters the pushing one also
          # received the unqualified `frr-<platform>`, resolved it to
          # docker.io/library/frr-<platform>, and failed with
          # `insufficient_scope` (run 34682460908, all three legs). The `Test`
          # lane still needs that bare name baked into the tar, because it does
          # `docker load` then `docker run frr-<platform>`; `Unit-Test` re-tags
          # the registry image itself after pulling.
          outputs: |
            type=docker,dest=/tmp/frr-${{ matrix.cfg.platform }}.tar,name=frr-${{ matrix.cfg.platform }}
            type=image,name=registry.blockcast.net/cache/frr-ci:img-${{ github.sha }}-${{ matrix.cfg.platform }},push=true
          # Harbor connectivity is intentionally required for heavy image builds.
          #
          # Read-only, on every ref including master. `cache-to` deliberately
          # lives in buildcache-seed.yml instead, because this workflow sets
          # `cancel-in-progress: true` on a group keyed only on `github.ref`:
          # when master was the sole cache writer it was also the most
          # cancellable run, so a second master push killed the write. Measured
          # over 44 master push runs (2026-07-02 -> 2026-08-21), 23 were
          # cancelled, 16 of them provably by the next master push. See
          # buildcache-seed.yml for the full reasoning and why exempting master
          # from cancellation was rejected instead.
          #
          # Keeping exactly one writer also avoids the concurrent-writer hazard
          # the matrix comment above records: two runs exporting to one
          # registry cache ref overwrite each other's manifest.
          cache-from: type=registry,ref=registry.blockcast.net/cache/frr-ci:${{ matrix.cfg.platform }}-buildcache
      - name: Upload docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cfg.platform }}-image
          path: /tmp/frr-${{ matrix.cfg.platform }}.tar
          # Docker images are intermediate CI artifacts; keep for a short period.
          retention-days: 7
          if-no-files-found: error
      - name: Clear any previous results
        # So if all jobs are re-run then all tests will be re-run
        run: |
          rm -rf test-results-${{ matrix.cfg.platform }}*
          mkdir -p test-results-${{ matrix.cfg.platform }}
          touch test-results-${{ matrix.cfg.platform }}/cleared-results.txt
      - name: Save cleared previous results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.cfg.platform }}
          path: test-results-${{ matrix.cfg.platform }}
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup
        if: ${{ always() }}
        run: rm -rf test-results-${{ matrix.cfg.platform }}* /tmp/frr-${{ matrix.cfg.platform }}.tar

  Unit-Test:
    runs-on: default
    needs: Build
    name: ${{ matrix.cfg.name }}
    # Derived, not rounded (BLO-29817 AC3).
    #
    # The work inside this job is hard-bounded: `make check` runs under
    # `timeout 15m --kill-after=1m`, so 16 min is the worst case no matter how
    # the suite grows. The only unbounded term was fetching the image, and the
    # 20-minute cap here was NOT a slow-job problem -- across runs 34458773163
    # / 34457085145 / 33977047139 the "Fetch docker image artifact" step
    # consumed 19.8 of the 20 minutes on its own and `Run unit tests` never
    # started. Median fetch was ~27 min, i.e. the old cap was unsatisfiable in
    # the median case and passed only when the fetch landed in the fastest
    # ~20%, matching the observed 3-success/7-cancelled rate.
    #
    # Replacing that artifact round-trip with a registry pull (below) is what
    # makes a finite cap meaningful again. 16 (bounded inner work) + 14 (pull
    # budget) = 30. The pull budget is a ceiling, not a measurement -- there is
    # no pull-time data for this lane yet, by construction. Re-derive it from
    # the "Fetch docker image" step across the first 5 post-merge runs and
    # tighten; if pulls land where the buildcache reads do, this should come
    # down a lot.
    #
    # Note this is NOT the `Test` lane's "just raise the cap" move, which was
    # tried and regressed inside 16 days: there the suite itself is unbounded
    # and grew past any cap. Here the suite is capped from the inside and the
    # variance term is being deleted rather than budgeted for.
    timeout-minutes: 30
    env:
      UNIT_TEST_CONTAINER: frr-${{ matrix.cfg.platform }}-unit-${{ github.run_id }}-${{ github.run_attempt }}
      UNIT_TEST_IMAGE: registry.blockcast.net/cache/frr-ci:img-${{ github.sha }}-${{ matrix.cfg.platform }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
        -  { name: 'Ubuntu 22.04 amd64 Unit Test', platform: 'amd64_u22' }
        -  { name: 'Ubuntu 24.04 amd64 Unit Test', platform: 'amd64_u24' }
    steps:
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Fetch docker image
        id: fetch_image
        # Tagged on `github.sha`, not `github.run_id`, so a --failed-only re-run
        # of just this job still resolves after Build is skipped.
        run: |
          set -euo pipefail
          docker pull "${UNIT_TEST_IMAGE}"
          docker tag "${UNIT_TEST_IMAGE}" frr-${{ matrix.cfg.platform }}
      - name: Run unit tests
        id: unit_tests
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=1m 15m \
          docker run --init --name "${UNIT_TEST_CONTAINER}" \
            frr-${{ matrix.cfg.platform }} \
            bash -lc '
              cd ~/frr
              rm -f tests/tests.xml
              make check
              status=$?
              if [ ! -s tests/tests.xml ]; then
                echo "ERROR: make check did not produce tests/tests.xml" >&2
                exit 125
              fi
              # tests/topotests/lib/ is collected by NEITHER pytest runner:
              # tests/pytest.ini sets norecursedirs=topotests, which hides it
              # from the "make check" run above, and tests/topotests/pytest.ini
              # lists lib in norecursedirs, which hides it from the topotest
              # job.  Unit tests living there therefore run nowhere unless the
              # path is named explicitly -- norecursedirs governs directory
              # recursion, not an explicit file argument -- so without this
              # step the file reads as coverage while providing none.
              # --noconftest keeps the munet/topogen machinery in
              # tests/topotests/conftest.py out of a pure unit test that needs
              # neither it nor root.
              PYTHONPATH=~/frr/tests/topotests \
                python3 -m pytest -q --noconftest -p no:cacheprovider \
                  tests/topotests/lib/test_kernel_state.py
              lib_status=$?
              # Exit 5 ("no tests collected") also lands here, so a future
              # change that stops collecting the file fails this job rather
              # than passing silently.
              if [ "${status}" -eq 0 ]; then
                status="${lib_status}"
              fi
              touch /tmp/frr-unit-test-report-ready
              exit "${status}"
            '
      - name: Gather unit test results
        id: gather_unit_test_results
        if: ${{ always() }}
        run: |
          rm -rf unit-test-results-${{ matrix.cfg.platform }}
          mkdir unit-test-results-${{ matrix.cfg.platform }}
          docker cp \
            "${UNIT_TEST_CONTAINER}":/tmp/frr-unit-test-report-ready \
            unit-test-results-${{ matrix.cfg.platform }}/report-ready
          docker cp \
            "${UNIT_TEST_CONTAINER}":/home/frr/frr/tests/tests.xml \
            unit-test-results-${{ matrix.cfg.platform }}/tests.xml
          test -s unit-test-results-${{ matrix.cfg.platform }}/tests.xml
      - name: Upload unit test results
        if: ${{ always() && steps.gather_unit_test_results.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.cfg.platform }}
          path: unit-test-results-${{ matrix.cfg.platform }}/tests.xml
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf unit-test-results-${{ matrix.cfg.platform }}
          docker rm -f "${UNIT_TEST_CONTAINER}" || true
      - name: Report why this job ended
        # BLO-29817 AC2, for this lane. A `timeout-minutes` kill is reported by
        # GitHub as `cancelled`, indistinguishable at a glance from a human
        # cancel or a `cancel-in-progress` eviction -- both routine in this
        # repo. Say it explicitly instead.
        #
        # This lane needs none of the elapsed-time machinery the `Test` lane
        # carries, because the work here is bounded from the inside: `make
        # check` runs under `timeout 15m`, so it can only ever FAIL on time,
        # never hang to the cap. A `cancelled` job therefore attributes off
        # which step was still in flight, with no clock involved.
        #
        # Guarded on `always()` + `job.status` rather than `cancelled()`, to
        # match the `Test` lane: that guard is the one observed to actually run
        # inside the post-cap grace window on this runner pool. Betting on
        # `cancelled()` firing for a *timeout* kill is the same assumption that
        # made this class of failure invisible in the first place.
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          FETCH_OUTCOME: ${{ steps.fetch_image.outcome }}
          TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          set -uo pipefail
          [ "${JOB_STATUS}" = "cancelled" ] || exit 0
          if [ -z "${TESTS_OUTCOME}" ] || [ "${TESTS_OUTCOME}" = "skipped" ]; then
            echo "::error title=BLO-29817 cap kill on image fetch::Job hit its \`timeout-minutes\` while \"Fetch docker image\" was still running (outcome=${FETCH_OUTCOME:-in-flight}); no unit test ever executed. This is NOT a human cancel and NOT a concurrency eviction. The registry pull is over budget -- re-derive the cap against the measured pull time rather than re-running. Ref BLO-29817."
          else
            echo "::error title=BLO-29817 cap kill after tests started::Job hit its \`timeout-minutes\` with \"Run unit tests\" at outcome=${TESTS_OUTCOME}. \`make check\` is capped at 15m internally, so this is tail/upload overrun rather than a slow suite. NOT a human cancel. Ref BLO-29817."
          fi

  Test:
    # BLO-21606: moved off arc-default — this ~43min Docker-heavy lane is the
    # same long/CPU-heavy shape BLO-19140 moved off arc-default for NOP after
    # mid-job runner loss under pool oversubscription. arc-e2e shares
    # arc-default's pod template (Docker/NET_ADMIN/KVM) but is capacity-capped.
    runs-on: arc-e2e
    needs: Build
    name: ${{ matrix.cfg.name }}
    # Topotest runs can be long; still cap runtime for stuck jobs.
    #
    # BLO-29817: this was 180, which sat *inside* the lane's own distribution
    # rather than outside it, so the cap fired on runs whose tests had already
    # finished.  Measured over 28 matrix legs across 20 `github-ci` runs
    # (2026-08-19 .. 2026-08-22):
    #
    #   suite ("Run topotests" step), n=24  min 127.6  median 143.4  p100 174.5
    #   job overhead (total - suite),  n=24  min   4.3  median   9.3  p100  21.9
    #
    # Overhead is dominated by "Fetch docker image artifact", which alone
    # ranged 1.3 .. 19.5 min -- variance that has nothing to do with the tests.
    # Those two p100s compose to 174.5 + 21.9 = 196.4 min, i.e. the old 180
    # cap was 16.4 min BELOW the worst case it had to survive.  Three legs were
    # duly killed at 181.0/181.0/182.2 min; in two of them the suite had
    # already PASSED and the cap landed in the artifact-upload tail.
    #
    # The suite p100 above is uncensored: all 24 observed "Run topotests" steps
    # reached a natural conclusion, so 174.5 is a real maximum and not a
    # cap-truncated one.
    #
    # 240 is therefore the composed p100 (196.4) plus 43.6 min, i.e. 1.22x,
    # which leaves 65.5 min for overhead == 3.0x the worst tail ever recorded.
    # Not chosen for roundness: 200 (1.02x) would be re-tripped by a single slow
    # artifact fetch, and 210 (1.6x overhead budget) still leaves under one
    # spare fetch.  Not larger, because a genuinely wedged job must not hold a
    # capacity-capped arc-e2e slot for longer than necessary -- 240 keeps that
    # bound at 4h while clearing the measured distribution.
    #
    # 2026-09-12: 240 was itself re-tripped -- 6 cap kills at 241..248 min in
    # the 12 runs after it landed, 3 of them with the suite still incomplete.
    # Both terms had grown, but they are not equally fixable: the overhead p100
    # went 21.9 -> 43.0 min (+120%) entirely inside "Fetch docker image
    # artifact", which moved a ~1 GiB tar through Actions artifact storage and
    # measured 5..43 min for the same bytes.  5 of the 6 kills had a fetch >=34
    # min.  That step is now a `docker pull` off Harbor instead (below), which
    # measured 2.0 and 4.3 min on the two `Unit-Test` legs of run 34688739805
    # -- the same image, the same registry, pulled minutes apart.
    #
    # The cap is deliberately NOT changed.  Raising it is the move that was
    # already tried here and regressed inside 16 days; what had actually eroded
    # was the 65.5 min this derivation set aside for overhead, and deleting the
    # artifact round-trip returns ~36-40 min of it to the suite.  A cap change
    # would also need TOPOTEST_JOB_CAP_MIN re-mirrored below for no gain.
    #
    # Re-derive with:
    #   gh api "repos/Blockcast/frr/actions/runs/$RID/jobs?per_page=100" | jq -r \
    #     '.jobs[]|select(.name|test("amd64 Test"))|"\(.name) \(.conclusion) \(((.completed_at|fromdate)-(.started_at|fromdate))/60|floor)min"'
    timeout-minutes: 240
    env:
      # Pushed by Build's second exporter. Tagged on `github.sha`, not
      # `github.run_id`, so a --failed-only re-run of just this job still
      # resolves after Build is skipped.
      TEST_IMAGE: registry.blockcast.net/cache/frr-ci:img-${{ github.sha }}-${{ matrix.cfg.platform }}
      # arc-e2e's DinD sidecar is capped at 2 CPUs. Nested Docker containers
      # still see all 48 host CPUs, so nproc-based sizing launched 120 pytest
      # workers per matrix leg and wedged a 64 GiB runner node under concurrent
      # legs. Preserve the intended 2.5x oversubscription against the real
      # cgroup budget instead.
      TOPOTEST_WORKERS: "5"
      # BLO-29817: must mirror `timeout-minutes` above (a job cannot read its
      # own cap at runtime).  Used only to report headroom and to attribute a
      # cap kill in the job summary; if the two drift the summary says so
      # instead of silently misreporting.
      TOPOTEST_JOB_CAP_MIN: "240"
    strategy:
      # Keep running remaining platforms when one leg fails.
      fail-fast: false
      # Both privileged topotest legs create hundreds of network namespaces and
      # write back through the same node-local DinD store. Run one leg per
      # workflow at a time so a scheduler co-location cannot multiply that load.
      max-parallel: 1
      matrix:
        cfg:
        -  { rel: '22.04', name: 'Ubuntu 22.04 amd64 Test', platform: 'amd64_u22' }
        -  { rel: '24.04', name: 'Ubuntu 24.04 amd64 Test', platform: 'amd64_u24' }
    steps:
      - name: Record lane start
        # BLO-29817: the runtime-vs-cap report at the end of this job needs a
        # start reference, and no context exposes the job's own start time.
        # First step in the job, so this trails "Set up job"/"Set up runner" by
        # only a few seconds.
        run: echo "TOPOTEST_LANE_START_EPOCH=$(date +%s)" >> "${GITHUB_ENV}"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Fetch docker image
        # Replaces a `download-artifact` + `docker load` round-trip that
        # measured 5..43 min for the same bytes and caused 5 of the 6 cap kills
        # at 241..248 min -- see the timeout-minutes derivation above.
        #
        # `Build` still exports the tar and still uploads the
        # `<platform>-image` artifact; this job was its only consumer, so both
        # are now dead weight.
        # ponytail: kept one run as a rollback path because this is the first
        # registry pull from arc-e2e in this repo. Delete Build's
        # `type=docker,dest=` exporter and its "Upload docker image artifact"
        # step once this lane is green post-merge.
        run: |
          set -euo pipefail
          docker pull "${TEST_IMAGE}"
          docker tag "${TEST_IMAGE}" frr-${{ matrix.cfg.platform }}
      - name: Fetch previous results
        # The seed artifact is (re-)created by Build's "Clear any previous
        # results" step. A --failed-only re-run of just this job skips Build,
        # so the seed from a prior attempt is never recreated and this
        # download 404s. Tolerate that: the script below already handles a
        # missing test-results-<platform> dir (BLO-21652).
        if: ${{ github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-results-${{ matrix.cfg.platform }}
          path: test-results-${{ matrix.cfg.platform }}
      - name: Run topotests
        # BLO-29817: `id` lets the runtime report below distinguish "the cap
        # killed the suite mid-run" from "the suite finished and the cap killed
        # the artifact tail".
        id: topotests
        run: |
          # Fail fast on command errors, undefined vars, and pipeline failures.
          set -euo pipefail
          uname -a
          MODPKGVER=$(uname -r)
          # Retry loop for apt-get update in case of transient mirror failures
          APT_RETRIES=3
          for i in $(seq 1 ${APT_RETRIES}); do sudo apt-get update -y && break || sleep 10; done
          # Retry install as well; mirrors can fail between update and install.
          install_ok=0
          for i in $(seq 1 ${APT_RETRIES}); do
            sudo apt-get install -y kmod linux-modules-extra-azure linux-modules-${MODPKGVER} linux-modules-extra-${MODPKGVER} python3-xmltodict && install_ok=1 && break || sleep 10
          done
          [ "${install_ok}" -eq 1 ] || { echo "ERROR: apt-get install failed after ${APT_RETRIES} attempts" >&2; exit 1; }
          # Github is running old kernels but installing newer packages :(
          sudo modprobe vrf || true
          sudo modprobe mpls-iptunnel
          sudo modprobe mpls-router

          ADD_DOCKER_ENV=""
          if ! grep CONFIG_IP_MROUTE_MULTIPLE_TABLES=y /boot/config*; then
            ADD_DOCKER_ENV+="-e MROUTE_VRF_MISSING=1"
          fi
          echo "ADD_DOCKER_ENV: ${ADD_DOCKER_ENV}"

          if [ -f test-results-${{ matrix.cfg.platform }}/topotests.xml ]; then
            ./tests/topotests/analyze.py -r test-results-${{ matrix.cfg.platform }}
            ls -l test-results-${{ matrix.cfg.platform }}/topotests.xml
            run_tests_raw=$(./tests/topotests/analyze.py -r test-results-${{ matrix.cfg.platform }}| cut -f1 -d: | sort -u)
            mapfile -t run_tests < <(printf '%s' "${run_tests_raw}")
          else
            echo "No test results dir"
            run_tests=()
          fi
          rm -rf test-results-${{ matrix.cfg.platform }}* /tmp/topotests

          echo "RUN_TESTS: ${run_tests[*]}"
          [[ "${TOPOTEST_WORKERS}" =~ ^[1-9][0-9]*$ ]]
          # As in the serial rerun below, the selected tests go through "$@"
          # rather than being glued onto the `bash -c` string: appending an
          # unquoted list there delivers only its first word to pytest and
          # turns the rest into positional parameters of the -c script, which
          # would silently narrow a targeted rerun to a single file.
          # The list is carried in a mapfile array so that one array element is
          # exactly one analyze.py record; expanding a scalar unquoted would
          # re-split those records on spaces and glob them, which the full node
          # IDs below make reachable.  An empty array expands to zero words, so
          # the ordinary "no prior results" path still runs the whole tree.
          if docker run --init -i --privileged --name frr-${{ matrix.cfg.platform }}-cont ${ADD_DOCKER_ENV} \
            -e TOPOTEST_WORKERS="${TOPOTEST_WORKERS}" -v /lib/modules:/lib/modules frr-${{ matrix.cfg.platform }} \
            bash -c 'cd ~/frr/tests/topotests ; sudo -E pytest -n"${TOPOTEST_WORKERS}" --dist=loadfile "$@"' pytest-run "${run_tests[@]}"; then
            echo "All tests passed."
            exit 0
          fi

          # Grab the results from the container
          if ! ./tests/topotests/analyze.py -Ar test-results-${{ matrix.cfg.platform }} -C frr-${{ matrix.cfg.platform }}-cont; then
            if [ ! -d test-results-${{ matrix.cfg.platform }} ]; then
              echo "ERROR: Basic failure in docker run, no test results directory available." >&2
              exit 1;
            fi
            if [ ! -f test-results-${{ matrix.cfg.platform }}/topotests.xml ]; then
            # In this case we may be missing topotests.xml
              echo "ERROR: No topotests.xml available perhaps docker run aborted?" >&2
              exit 1;
            fi
            echo "WARNING: analyze.py returned error but grabbed results anyway." >&2
          fi

          # Save some information useful for debugging
          cp /boot/config* test-results-${{ matrix.cfg.platform }}/
          sysctl -a > test-results-${{ matrix.cfg.platform }}/sysctl.out 2> /dev/null

          # Now get the failed tests (if any) from the archived results directory.
          # Keep the FULL pytest node IDs (file.py::test_name).  The previous
          # `cut -f1 -d:` truncated them to bare file paths, discarding the only
          # information that makes it possible to check afterwards that the
          # rerun re-ran the tests that actually failed.
          #
          # Read them into an array rather than a scalar: analyze.py emits one
          # node ID per line, and only an array preserves that framing.  A
          # scalar expanded unquoted re-splits on spaces and is glob-expanded,
          # so a parametrized ID -- `test_x[a b]`, which `cut` used to strip --
          # would arrive at pytest as two unknown IDs instead of one real one.
          # The capture stays a command substitution so that `set -e` still
          # aborts the step when analyze.py fails; feeding mapfile directly
          # from a process substitution would silently drop that.
          rerun_tests_raw=$(./tests/topotests/analyze.py -r test-results-${{ matrix.cfg.platform }} | sort -u)
          mapfile -t rerun_tests < <(printf '%s' "${rerun_tests_raw}")
          if [ ${#rerun_tests[@]} -eq 0 ]; then
            echo "ERROR: Parallel pytest run failed but no failures found in topotests.xml." >&2
            exit 1
          fi

          echo "ERROR: Some tests failed during parallel run, rerunning serially." >&2
          echo "RERUN_TESTS: ${rerun_tests[*]}" >&2
          docker stop frr-${{ matrix.cfg.platform }}-cont
          docker rm frr-${{ matrix.cfg.platform }}-cont

          mv test-results-${{ matrix.cfg.platform }} test-results-${{ matrix.cfg.platform }}-initial

          # Pass the test IDs as real positional arguments consumed by "$@",
          # NOT by concatenating them onto the `bash -c` script string.
          # Appending an unquoted word list to `bash -c 'cmd '$list` hands only
          # the FIRST word to cmd; every later word becomes $0, $1, ... of the
          # -c script and is silently discarded.  In run 32421578651 that fed
          # pytest one of the two failing files -- the other never reached it,
          # so pytest collected 5 tests, passed them, exited 0, and the step
          # reported success over three real failures.
          rerun_rc=0
          docker run --init -i --privileged --name frr-${{ matrix.cfg.platform }}-cont ${ADD_DOCKER_ENV} -v /lib/modules:/lib/modules frr-${{ matrix.cfg.platform }} \
            bash -c 'cd ~/frr/tests/topotests ; sudo -E pytest "$@"' pytest-rerun "${rerun_tests[@]}" || rerun_rc=$?

          # pytest's exit code only claims "everything I collected passed",
          # which is strictly weaker than "every test we named passed".  A
          # target that collects nothing -- renamed, uncollectable, or never
          # delivered to pytest at all -- yields 0 items and exit 0.  Verify
          # coverage against the harvested IDs before believing that 0.
          printf '%s\n' "${rerun_tests[@]}" > /tmp/rerun-expected.txt
          rerun_xml=/tmp/rerun-results.xml
          rm -f "${rerun_xml}"
          if ! docker cp frr-${{ matrix.cfg.platform }}-cont:/tmp/topotests/topotests.xml "${rerun_xml}"; then
            echo "ERROR: the rerun produced no topotests.xml, so which tests ran cannot be verified." >&2
            exit 1
          fi
          if ! python3 .github/scripts/verify_rerun_coverage.py \
                 --expected /tmp/rerun-expected.txt --results "${rerun_xml}"; then
            exit 1
          fi

          if [ "${rerun_rc}" -ne 0 ]; then
            echo "Some rerun tests still failed."
            exit 1
          fi
          echo "All rerun tests passed."
          exit 0
      - name: Gather results
        if: ${{ always() }}
        run: |
          if [ ! -d test-results-${{ matrix.cfg.platform }} ]; then
            if ! ./tests/topotests/analyze.py -Ar test-results-${{ matrix.cfg.platform }} -C frr-${{ matrix.cfg.platform }}-cont; then
              echo "ERROR: gathering results produced an error, perhaps due earlier run cancellation." >&2
            fi
          fi
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.cfg.platform }}
          path: |
            test-results-${{ matrix.cfg.platform }}
            test-results-${{ matrix.cfg.platform }}-initial
          overwrite: true
          # Keep test artifacts longer to aid flaky test/debug investigations.
          retention-days: 14
          if-no-files-found: warn
      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf test-results-${{ matrix.cfg.platform }}*
          docker stop frr-${{ matrix.cfg.platform }}-cont || true
          docker rm frr-${{ matrix.cfg.platform }}-cont || true
      - name: Report lane runtime and attribute any cap kill
        # BLO-29817: a `timeout-minutes` kill is reported by GitHub as
        # `cancelled`, which is indistinguishable from a human pressing cancel
        # or a `cancel-in-progress` concurrency eviction -- both routine here.
        # Three separate investigations on BLO-29523 read that `cancelled` and
        # did not recognise it as a timeout.  So say it explicitly.
        #
        # This step runs LAST on purpose: in two of the three observed kills the
        # suite had already finished and the cap landed during "Upload test
        # results", so a report placed before the upload would have seen healthy
        # headroom and missed the kill entirely.  Cancellation still lets
        # `always()` steps run -- in all three kills the upload, cleanup and
        # post steps completed after the cap fired -- and this step is pure
        # bash, so it lands inside that grace window.
        if: ${{ always() }}
        env:
          SUITE_CONCLUSION: ${{ steps.topotests.conclusion }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          cap="${TOPOTEST_JOB_CAP_MIN}"

          # Keep the mirrored cap honest against the real `timeout-minutes`.
          # Scoped to the `Test:` job's own block: latch on the job key, and
          # bail at the next key at that indent so a later job's cap can never
          # be read as this one's.  Advisory only -- a formatting change to the
          # workflow must not be able to fail the topotest lane.
          configured=$(awk '
            /^  Test:$/       { f=1; next }
            f && /^  [^ #]/   { exit }
            f && /^    timeout-minutes:/ { print $2; exit }
          ' .github/workflows/github-ci.yml 2>/dev/null || true)
          if [ -z "${configured}" ]; then
            echo "::warning title=BLO-29817 cap mirror uncheckable::could not read timeout-minutes out of the Test job; headroom below assumes TOPOTEST_JOB_CAP_MIN=${cap}"
          elif [ "${configured}" != "${cap}" ]; then
            echo "::error title=BLO-29817 cap mirror drift::TOPOTEST_JOB_CAP_MIN=${cap} but timeout-minutes=${configured}; headroom figures below are unreliable until they match"
            cap="${configured}"
          fi

          if [ -z "${TOPOTEST_LANE_START_EPOCH:-}" ]; then
            echo "::warning title=BLO-29817::lane start was never recorded; cannot attribute runtime"
            exit 0
          fi
          elapsed=$(( ( $(date +%s) - TOPOTEST_LANE_START_EPOCH ) / 60 ))
          headroom=$(( cap - elapsed ))

          # How close to the cap a *cancelled* job must land before the cap --
          # rather than a human or the concurrency group -- is the explanation.
          # The three observed kills overshot by 1.0/1.0/2.2 min, so 5 covers
          # them with margin; it is not applied to jobs that were not cancelled.
          near=5

          {
            echo "### ${{ matrix.cfg.name }} — lane runtime"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| elapsed | **${elapsed} min** |"
            echo "| cap (\`timeout-minutes\`) | ${cap} min |"
            echo "| headroom | **${headroom} min** |"
            echo "| suite step | \`${SUITE_CONCLUSION:-not-reached}\` |"
            echo "| job status | \`${JOB_STATUS}\` |"
            echo
          } >> "${summary}"

          # Cancellation is the necessary condition, headroom only the
          # discriminator.  A cap kill and an external cancel are BOTH stamped
          # `cancelled` by GitHub and are told apart by how close to the cap
          # they landed -- but a job that reached a conclusion of its own was by
          # definition not killed, however little headroom it had left.  Gating
          # on JOB_STATUS first is what stops a merely-slow *successful* leg
          # (one landing inside `near` on its own steam -- 176/180 min has
          # already happened once) from being reported as a timeout kill.
          if [ "${JOB_STATUS}" = "cancelled" ]; then
            if [ "${headroom}" -gt "${near}" ]; then
              # Far from the cap, so this really was external.
              echo "Cancelled externally (human or \`cancel-in-progress\`) at ${elapsed} min, ${headroom} min clear of the ${cap}-minute cap — **not** a timeout." >> "${summary}"
              echo "::notice title=External cancel::Cancelled at ${elapsed}/${cap} min with ${headroom} min of headroom — not a timeout."
              exit 0
            fi
            case "${SUITE_CONCLUSION}" in
              success|failure)
                # The false-cancel case this ticket exists for: the tests
                # finished and reported, then the cap killed the tail.
                echo "**:stopwatch: KILLED BY THE JOB TIMEOUT — and the tests had already finished (\`${SUITE_CONCLUSION}\`).**" >> "${summary}"
                echo "" >> "${summary}"
                echo "This job was **not** cancelled by a person and **not** evicted by concurrency. The suite ran to completion; the ${cap}-minute cap fired during the artifact/cleanup tail, so GitHub stamped the job \`cancelled\` and the rollup went red over a result that was actually \`${SUITE_CONCLUSION}\`. Do **not** just raise \`timeout-minutes\` — that was tried twice here (180 -> 240) and was re-consumed within 16 days both times. Find the overhead and delete it; see the derivation above. Ref BLO-29817." >> "${summary}"
                echo "::error title=Job timeout (tests already ${SUITE_CONCLUSION})::Cap kill at ${elapsed}/${cap} min during the post-suite tail — NOT a human cancel or concurrency eviction. Tests concluded ${SUITE_CONCLUSION}. See BLO-29817."
                ;;
              *)
                echo "**:stopwatch: KILLED BY THE JOB TIMEOUT while the suite was still running.**" >> "${summary}"
                echo "" >> "${summary}"
                echo "Not a human cancel and not a concurrency eviction: elapsed ${elapsed} min against a ${cap}-minute cap. Either the suite genuinely regressed past its measured p100 or it is wedged. Ref BLO-29817." >> "${summary}"
                echo "::error title=Job timeout (suite incomplete)::Cap kill at ${elapsed}/${cap} min with the suite in state '${SUITE_CONCLUSION:-not-reached}' — NOT a human cancel or concurrency eviction. See BLO-29817."
                ;;
            esac
            exit 0
          fi

          # Reached its own conclusion.  Leave the headroom on the record so the
          # cap can be re-derived from ordinary runs instead of only from
          # failures -- and shout when a leg only just cleared the cap, because
          # that is the signal that the derivation is going stale.
          if [ "${headroom}" -le "${near}" ]; then
            echo "**:warning: Finished \`${JOB_STATUS}\` with only ${headroom} min to spare** — this leg came within ${near} min of the ${cap}-minute cap without being killed. Not a timeout, but the next one may be. Re-derive the cap (BLO-29817)." >> "${summary}"
            echo "::warning title=Topotest lane nearly hit the cap::Finished ${JOB_STATUS} at ${elapsed}/${cap} min — ${headroom} min spare. NOT a timeout kill, but re-derive the cap (BLO-29817)."
          elif [ "${headroom}" -le 20 ]; then
            echo "::warning title=Low topotest headroom::Finished at ${elapsed}/${cap} min — only ${headroom} min spare. Re-check the cap derivation (BLO-29817)."
          fi

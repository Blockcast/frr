!
! r2 -- the demo box (the Blockcast-run FRR appliance).
!
debug zebra events
!
! s1: the GRE underlay, and the UNDERLAY eBGP session.
!
! NOTE -- r2-eth0 deliberately does NOT run PIM.  The underlay carries the
! GRE outer and a BGP session and nothing else.  RPF never RESOLVES here:
! pimd rejects a nexthop on a non-PIM interface outright, clears the
! upstream's rpf and sends no join -- which is the silent-zero-delivery
! failure the negative control reproduces.  It only gets that far because
! r2 sets `maximum-paths 1`; see r2/bgpd.conf.
interface r2-eth0
 ip address 10.0.0.2/24
!
interface gre-sfmix0
 ip address 10.99.1.2/30
!
! s3: the receiver stub (h2 == 10.20.20.10).
interface r2-eth1
 ip address 10.20.20.1/24
!
ip forwarding
!

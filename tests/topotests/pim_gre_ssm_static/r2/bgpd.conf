!
! r2 -- demo box.  Accepts both sessions with no inbound policy: the point
! of the suite is that r1's OUTBOUND policy is the only thing pinning RPF
! to the tunnel, so r2 must not quietly help.
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 !
 ! Underlay session.  Peer address 10.0.0.1 is LOWER than the tunnel peer
 ! 10.99.1.1 -- when both sessions carry the source prefix every earlier
 ! bestpath step ties (same AS_PATH length, same origin, no MED, both
 ! eBGP, and both paths come from the SAME router-id 10.0.0.1), so
 ! selection falls through to lowest peer address and the UNDERLAY wins.
 ! That is deliberate: it makes the negative control deterministic rather
 ! than a coin flip.
 neighbor 10.0.0.1 remote-as 65001
 !
 ! Tunnel-inner session.
 neighbor 10.99.1.1 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.99.1.1 activate
 exit-address-family
!

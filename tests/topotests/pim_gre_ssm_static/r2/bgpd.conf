!
! r2 -- demo box.  Accepts both sessions with no inbound policy: the point
! of the suite is that r1's OUTBOUND policy is the only thing pinning RPF
! to the tunnel, so r2 must not quietly help.
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 !
 ! WITHOUT the next line the negative control does not merely flake -- it
 ! fails every time.  Bestpath step 12 (bgp_route.c:1738, "prefer the path
 ! that was received first") runs BEFORE router-id and peer address, and
 ! fires whenever both paths are eBGP.  The tunnel session carries the
 ! prefix from setup, so when the test removes r1's outbound policy the
 ! underlay path is strictly newer and loses on age -- selection never
 ! reaches the tiebreak this suite exists to exercise.  Observed as
 ! `selectionReason: "Older Path"`, tunnel 10.99.1.1 selected.
 !
 ! `compare-routerid` is precisely the knob that skips step 12: its guard
 ! is `!CHECK_FLAG(bgp->flags, BGP_FLAG_COMPARE_ROUTER_ID)`.
 !
 ! This is a determinism knob for the HARNESS, and the reason it is needed
 ! is itself a finding about the demo box: in the field, with step 12 live,
 ! which session wins is decided by SESSION ARRIVAL ORDER.  A tunnel flap
 ! that re-establishes the tunnel session after the underlay one flips RPF
 ! to the underlay and silently delivers zero.  See the E15 note in
 ! test_pim_gre_ssm_static.py.
 bgp bestpath compare-routerid
 !
 ! Underlay session.  Peer address 10.0.0.1 is LOWER than the tunnel peer
 ! 10.99.1.1 -- with step 12 skipped, every remaining earlier bestpath step
 ! ties (same AS_PATH length, same origin, no MED, both eBGP, and both
 ! paths come from the SAME router-id 10.0.0.1, so step 13 router-id and
 ! step 14 cluster length are both draws), and selection falls through to
 ! step 15 lowest peer address, where the UNDERLAY wins.  That is
 ! deliberate: it makes the negative control deterministic.
 neighbor 10.0.0.1 remote-as 65001
 !
 ! Tunnel-inner session.
 neighbor 10.99.1.1 remote-as 65001
 !
 address-family ipv4 unicast
  ! Second determinism knob, and the second one whose reason is a finding.
  !
  ! `compare-routerid` above only fixes which path bestpath SELECTS.  It
  ! does not decide RPF, because FRR enables eBGP multipath BY DEFAULT:
  ! bgp_create() sets maxpaths_ebgp = multipath_num (bgpd/bgpd.c:4072),
  ! not 1.  So once the test removes r1's outbound policy, BOTH paths tie
  ! on every multipath attribute, both get BGP_PATH_MULTIPATH, and zebra
  ! is handed BOTH nexthops -- 10.0.0.1 via r2-eth0 and 10.99.1.1 via the
  ! tunnel.  Observed: `"multipath":true` on both paths with
  ! `selectionReason":"Neighbor IP"` naming the underlay as bestpath.
  !
  ! pimd then resolves RPF over that ECMP set (pim_nht_lookup_ecmp) and
  ! keeps the tunnel, because with neigh_needed set (pim_rpf.c:85, r2 is
  ! not the FHR) the underlay member is rejected -- r2-eth0 runs no PIM.
  ! The negative control therefore could never fire: bestpath moved and
  ! RPF did not.
  !
  ! THE FIELD FINDING, and it inverts the hazard this ticket describes.
  ! On a stock demo box the tunnel does NOT lose RPF when the prefix also
  ! arrives over the underlay -- both are installed and PIM-capability is
  ! the tiebreak, so delivery survives.  The silent zero appears only when
  ! the underlay is ALSO PIM-enabled: both members then pass pimd's
  ! usability checks, so RPF resolves onto whichever comes first in zebra's
  ! nexthop order -- and if that is the underlay, the upstream it resolves
  ! onto cannot forward the source, so the stream silently delivers zero.
  ! Which member that is is not a routing policy decision at all.  (Not a
  ! hash: `ip pim ecmp` is unset here, so pim->ecmp_enable is false,
  ! mod_val stays 0, and the loop at pim_nht.c:1489 simply takes the first
  ! USABLE member.)
  !
  ! READ THE NEXT LINE AS A HARNESS KNOB, NOT AS DEMO-BOX ADVICE.
  ! `maximum-paths 1` is the mitigation for a box whose underlay ALSO runs
  ! PIM, where it replaces that nondeterministic member selection with
  ! policy-controlled bestpath.  On THIS box, whose underlay runs no PIM,
  ! it does the opposite: it installs the underlay bestpath alone, leaves
  ! pimd no usable member, and clears the RPF.  That is exactly what makes
  ! the negative control able to fire -- and applying it to a stock demo
  ! box would convert surviving delivery into a silent zero.
  maximum-paths 1
  neighbor 10.0.0.1 activate
  neighbor 10.99.1.1 activate
 exit-address-family
!

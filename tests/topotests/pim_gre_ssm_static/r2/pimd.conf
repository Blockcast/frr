!
! r2 -- demo box.  Normal PIM: hellos ON, NOT `ip pim light`, no DIMT.
!
debug pim trace
debug pim zebra
!
interface gre-sfmix0
 ip pim
 ip pim hello 3
!
! The receiver stub.  `ip igmp` accepts h2's IGMPv3 source-specific
! membership; the join itself is issued by the host, not configured
! statically, so the suite exercises the real IGMPv3 -> PIM (S,G) path.
interface r2-eth1
 ip pim
 ip igmp
!

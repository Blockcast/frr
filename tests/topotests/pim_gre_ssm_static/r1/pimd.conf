!
! r1 -- source PE.  Normal PIM: hellos ON, NOT `ip pim light`, no DIMT.
!
debug pim trace
!
! 232.0.0.0/8 is FRR's default SSM range, so no `ssm prefix-list` is
! needed for 232.1.1.10.
!
! The source LAN.  PIM here is what lets r1 build the (S,G) and accept the
! stream from h1.
interface r1-eth1
 ip pim
!
! The tunnel.  `ip pim hello 3` is the whole reason this suite runs in
! minutes rather than hours: FRR derives the neighbor holdtime as
! 3.5 x hello, so a 3s hello gives a 10.5s holdtime and the sub-holdtime
! flap assertion can use a ~4s outage instead of a ~105s one.  Both ends
! must agree -- r2/pimd.conf carries the same value.
interface gre-sfmix0
 ip pim
 ip pim hello 3
!

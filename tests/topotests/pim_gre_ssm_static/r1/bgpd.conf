!
! r1 -- source PE.  TWO eBGP sessions to r2, and the policy that decides
! which one carries the source prefix.
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 !
 ! Underlay session, over s1.
 neighbor 10.0.0.2 remote-as 65002
 !
 ! Tunnel-inner session, over the GRE.  Directly connected on
 ! 10.99.1.0/30, so no ebgp-multihop is needed.
 neighbor 10.99.1.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.10.10.0/24
  !
  ! THE POLICY.  The source prefix is announced ONLY over the tunnel.
  ! test_rpf_negative_control_underlay_steals_rpf removes this one line at
  ! runtime and asserts RPF leaves the tunnel.
  neighbor 10.0.0.2 route-map TUNNEL-ONLY-SRC out
  neighbor 10.99.1.2 activate
 exit-address-family
!
ip prefix-list SRC seq 5 permit 10.10.10.0/24
!
route-map TUNNEL-ONLY-SRC deny 10
 match ip address prefix-list SRC
!
route-map TUNNEL-ONLY-SRC permit 20
!

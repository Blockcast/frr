!
! r1 -- the source PE.
!
debug zebra events
!
! s1: the GRE underlay, and the UNDERLAY eBGP session.
interface r1-eth0
 ip address 10.0.0.1/24
!
! The static GRE tunnel.  The netdev itself (type gre, ttl 64, outer
! 10.0.0.1 -> 10.0.0.2) is created by _populate_iface() before zebra
! starts, so zebra sees it as an ordinary interface; only the inner
! addressing lives here.
!
! 10.99.1.1 is deliberately HIGHER than r1's underlay address 10.0.0.1.
! That ordering is what makes the RPF negative control deterministic --
! see the RPF tiebreak note in test_pim_gre_ssm_static.py.
interface gre-sfmix0
 ip address 10.99.1.1/30
!
! s2: the source LAN (h1 == 10.10.10.10, the SSM source).
interface r1-eth1
 ip address 10.10.10.1/24
!
ip forwarding
!

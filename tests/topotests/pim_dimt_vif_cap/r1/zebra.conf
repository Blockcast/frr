!
debug zebra events
!
! lo carries the UMHs, one per source prefix.  None is on a segment r2 is
! connected to, so on r2 only a DIMT netdev (or a covering interface the
! test builds on purpose) can resolve a pin toward one.
interface lo
 ip address 10.99.1.1/32
 ip address 10.99.2.1/32
 ip address 10.99.3.1/32
 ip address 10.99.4.1/32
!
! s1: underlay for every GRE outer, and the eBGP session.
interface r1-eth0
 ip address 10.0.0.1/24
!
! s2: the source LAN, one prefix per UMH.
interface r1-eth1
 ip address 10.10.1.1/24
 ip address 10.10.2.1/24
 ip address 10.10.3.1/24
 ip address 10.10.4.1/24
!
ip forwarding
!

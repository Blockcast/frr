!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65002
 address-family ipv4 unicast
  redistribute connected route-map UMH
 exit-address-family
!
! One UMH per source prefix, so each (S,G) on r2 demands its own tunnel.
ip prefix-list SRC1 seq 5 permit 10.10.1.0/24
ip prefix-list SRC2 seq 5 permit 10.10.2.0/24
ip prefix-list SRC3 seq 5 permit 10.10.3.0/24
ip prefix-list SRC4 seq 5 permit 10.10.4.0/24
!
route-map UMH permit 10
 match ip address prefix-list SRC1
 set extcommunity umh 10.99.1.1 pim preference 5
!
route-map UMH permit 20
 match ip address prefix-list SRC2
 set extcommunity umh 10.99.2.1 pim preference 5
!
route-map UMH permit 30
 match ip address prefix-list SRC3
 set extcommunity umh 10.99.3.1 pim preference 5
!
route-map UMH permit 40
 match ip address prefix-list SRC4
 set extcommunity umh 10.99.4.1 pim preference 5
!
route-map UMH permit 50
!

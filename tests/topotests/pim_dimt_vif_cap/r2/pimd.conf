!
debug pim trace
debug pim zebra
!
! The cap under test.  Well under the vif budget, so the suite exercises the
! configured limit; test_default_limit_is_the_vif_budget removes it to
! exercise the derived default.
dimt tunnel-limit 2
!
! Three endpoint rows, three UMHs, one more than the cap.  Distinct GRE keys:
! the outers are identical, and the kernel refuses two keyless GRE netdevs
! with the same local/remote.
dimt tunnel-endpoint 10.99.1.1 inner-local 10.99.1.2 outer-local 10.0.0.2 outer 10.0.0.1 encap gre key 1
dimt tunnel-endpoint 10.99.2.1 inner-local 10.99.2.2 outer-local 10.0.0.2 outer 10.0.0.1 encap gre key 2
dimt tunnel-endpoint 10.99.3.1 inner-local 10.99.3.2 outer-local 10.0.0.2 outer 10.0.0.1 encap gre key 3
!
! 10.99.4.1 deliberately has NO endpoint row: it never demands a tunnel, so
! its pin can only come from a covering interface.  The pin stage uses it.
!
interface r2-eth1
 ip pim passive
 ip igmp
 ip igmp static-group 232.1.1.1 10.10.1.10
 ip igmp static-group 232.1.1.2 10.10.2.10
 ip igmp static-group 232.1.1.3 10.10.3.10
 ip igmp static-group 232.1.1.4 10.10.4.10
!

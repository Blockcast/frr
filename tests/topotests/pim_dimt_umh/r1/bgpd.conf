!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65002
 neighbor 2001:db8:1::2 remote-as 65002
 address-family ipv4 unicast
  redistribute connected route-map UMH
  no neighbor 2001:db8:1::2 activate
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:1::2 activate
  redistribute connected route-map UMH6
 exit-address-family
!
ip prefix-list SRC seq 5 permit 10.10.10.0/24
!
ipv6 prefix-list SRC6 seq 5 permit 2001:db8:10::/64
!
route-map UMH permit 10
 match ip address prefix-list SRC
 set extcommunity umh 10.0.0.1 pim preference 5
!
route-map UMH permit 20
!
route-map UMH6 permit 10
 match ipv6 address prefix-list SRC6
 set extcommunity umh 2001:db8:1::1 pim preference 5
!
route-map UMH6 permit 20
!

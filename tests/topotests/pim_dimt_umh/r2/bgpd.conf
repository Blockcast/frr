!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 2001:db8:1::1 remote-as 65001
! r1 is the source PE that originates 10.10.10.0/24 (and 2001:db8:10::/64)
! and stamps the UMH EC on it.  Without this the UMH is ignored and counted:
! the 0x80 EC is honoured only from a dimt-trusted neighbor (BLO-36553).
 neighbor 10.0.0.1 dimt-trusted
 neighbor 2001:db8:1::1 dimt-trusted
 address-family ipv4 unicast
  no neighbor 2001:db8:1::1 activate
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:1::1 activate
 exit-address-family
!

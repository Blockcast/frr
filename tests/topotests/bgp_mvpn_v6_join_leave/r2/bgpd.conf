debug bgp updates
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
 exit-address-family
 address-family ipv6 mvpn
  neighbor 10.0.0.1 activate
 exit-address-family
!

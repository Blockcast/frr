!
debug bgp updates
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 timers 3 10
 neighbor 10.0.2.2 remote-as 65003
 neighbor 10.0.2.2 timers 3 10
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
  neighbor 10.0.2.2 activate
 exit-address-family
 address-family ipv6 mvpn
  neighbor 10.0.0.2 activate
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 route-map BLOCK-MVPN out
  bgp mvpn source-active 2001:db8::1 group ff3e::1
 exit-address-family
!
route-map BLOCK-MVPN deny 10
!

! r1: the upstream PE and UMH.  It is two underlay hops from r2 (via r3), so
! a DIMT control packet only reaches it if the tunnel's OUTER TTL survives a
! transit router.
!
! The UMH side of each tunnel is a static GRE netdev created by the test
! (gre-a, gre-b) before the daemons start, carrying the UMH as its local
! point-to-point address and running `ip pim light` -- the same shape as a
! stock operator-managed UMH.  r1 therefore holds (S,G) join state on gre-a /
! gre-b exactly while r2's joins keep arriving, which is what the test reads.
!
debug pim trace
debug pim packets joins
!
! The tunnel outer endpoints live on lo, one per UMH: two tunnels between
! the same pair of outer addresses would collide on the kernel's GRE tuple,
! and during a steer both exist at once.
interface lo
 ip address 10.255.0.1/32
 ip address 10.255.0.5/32
!
interface r1-eth0
 ip address 10.0.1.1/24
!
interface r1-eth1
 ip address 10.10.10.1/24
 ip pim
!
interface gre-a
 ip pim
 ip pim light
!
interface gre-b
 ip pim
 ip pim light
!
ip route 10.0.2.0/24 10.0.1.2
!
router bgp 65001
 bgp router-id 10.0.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 ebgp-multihop 3
 neighbor 10.0.2.2 update-source 10.0.1.1
 address-family ipv4 unicast
  redistribute connected route-map UMH
 exit-address-family
!
ip prefix-list SRC seq 5 permit 10.10.10.0/24
!
! Only the source prefix is advertised: r2 must reach each UMH solely through
! its DIMT tunnel.  The UMH is switched between 10.99.0.1 (gre-a) and
! 10.99.0.5 (gre-b) at runtime to steer.
route-map UMH permit 10
 match ip address prefix-list SRC
 set extcommunity umh 10.99.0.1 pim preference 5
!

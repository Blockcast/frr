! r2: the receiver PoP.  pimd requests DIMT tunnels toward r1's UMHs across
! r3; the static IGMP membership that creates demand is added by the test so
! that each stage can time the join from a known instant.
!
debug pim trace
debug pim zebra
debug zebra dplane
!
interface r2-eth0
 ip address 10.0.2.2/24
!
interface r2-eth1
 ip address 10.20.20.1/24
 ip pim passive
 ip igmp
!
ip route 10.0.1.0/24 10.0.2.1
ip route 10.255.0.0/24 10.0.2.1
!
dimt tunnel-endpoint 10.99.0.1 inner-local 10.99.0.2 outer-local 10.0.2.2 outer 10.255.0.1 encap gre
dimt tunnel-endpoint 10.99.0.5 inner-local 10.99.0.6 outer-local 10.0.2.2 outer 10.255.0.5 encap gre
!
router bgp 65002
 bgp router-id 10.0.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 ebgp-multihop 3
 neighbor 10.0.1.1 update-source 10.0.2.2
 address-family ipv4 unicast
 exit-address-family
!

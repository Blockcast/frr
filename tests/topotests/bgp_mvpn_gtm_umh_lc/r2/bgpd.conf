!
router bgp 65010
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 neighbor 2001:db8:1::1 remote-as 65001
 neighbor 2001:db8:1::1 timers 3 10
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  network 10.10.10.0/24 route-map rm-p1
  network 10.10.20.0/24 route-map rm-p2
  network 10.10.30.0/24 route-map rm-p3
  network 10.10.40.0/24 route-map rm-p4
  network 10.10.50.0/24 route-map rm-p5
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:1::1 activate
  network 2001:db8:53::/64 route-map rm-p6
 exit-address-family
!
! p1: valid UMH large community AND a plain RT extended community -- the
! precedence probe (LC wins when the knob is set; EC when it is not).
route-map rm-p1 permit 10
 set large-community 65010:1:184549374
 set extcommunity rt 10.9.9.9:0
!
! p2: Global Administrator 65999 != origin AS 65010 -- the trust check must
! reject the tuple and fall back to the extended community.
route-map rm-p2 permit 10
 set large-community 65999:1:184549374
 set extcommunity rt 10.9.9.9:0
!
! p3: two valid tuples -- the lowest (167772161 = 10.0.0.1) must win.
route-map rm-p3 permit 10
 set large-community 65010:1:184549374 65010:1:167772161
!
! p4: parameter 3758096385 = 224.0.0.1 (multicast) -- invalid upstream PE
! address, must fall back to the extended community.
route-map rm-p4 permit 10
 set large-community 65010:1:3758096385
 set extcommunity rt 10.9.9.9:0
!
! p5: large community ONLY -- no extended community and no Source Active
! route exists for its (S,G), so a silently failing LC decode would leave
! the Type-7 RT-less (nothing to fall back to).
route-map rm-p5 permit 10
 set large-community 65010:1:184549374
!
! p6: the v6 source's covering route -- same v4 UMH in the large community.
route-map rm-p6 permit 10
 set large-community 65010:1:184549374
!

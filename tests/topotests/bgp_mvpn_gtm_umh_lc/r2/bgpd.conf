!
router bgp 65010
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 neighbor 2001:db8:1::1 remote-as 65001
 neighbor 2001:db8:1::1 timers 3 10
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  network 10.10.10.0/24 route-map rm-p1
  network 10.10.20.0/24 route-map rm-p2
  network 10.10.30.0/24 route-map rm-p3
  network 10.10.40.0/24 route-map rm-p4
  network 10.10.50.0/24 route-map rm-p5
  network 10.10.70.0/24 route-map rm-p7
  network 10.10.80.0/24 route-map rm-p8
  network 10.10.90.0/24 route-map rm-p9
  network 10.10.100.0/24 route-map rm-p10
  network 10.10.110.0/24 route-map rm-p11
  network 10.10.120.0/24 route-map rm-p12
  network 10.10.130.0/24 route-map rm-p13
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:1::1 activate
  network 2001:db8:53::/64 route-map rm-p6
 exit-address-family
!
! p1: valid UMH large community AND a plain RT extended community -- the
! precedence probe (LC wins when the knob is set; EC when it is not).
route-map rm-p1 permit 10
 set large-community 65010:1:184549374
 set extcommunity rt 10.9.9.9:0
!
! p2: Global Administrator 65999 != origin AS 65010 -- the trust check must
! reject the tuple and fall back to the extended community.
route-map rm-p2 permit 10
 set large-community 65999:1:184549374
 set extcommunity rt 10.9.9.9:0
!
! p3: two valid tuples -- the lowest (167772161 = 10.0.0.1) must win.
route-map rm-p3 permit 10
 set large-community 65010:1:184549374 65010:1:167772161
!
! p4: parameter 3758096385 = 224.0.0.1 (multicast) -- invalid upstream PE
! address, must fall back to the extended community.
route-map rm-p4 permit 10
 set large-community 65010:1:3758096385
 set extcommunity rt 10.9.9.9:0
!
! p5: large community ONLY -- no extended community and no Source Active
! route exists for its (S,G), so a silently failing LC decode would leave
! the Type-7 RT-less (nothing to fall back to).
route-map rm-p5 permit 10
 set large-community 65010:1:184549374
!
! p6: the v6 source's covering route -- same v4 UMH in the large community.
route-map rm-p6 permit 10
 set large-community 65010:1:184549374
!
! p7: parameter 0 -> 0.0.0.0 is not a usable upstream PE address; the
! invalid-parameter check must reject it and fall back to the extended
! community.
route-map rm-p7 permit 10
 set large-community 65010:1:0
 set extcommunity rt 10.9.9.9:0
!
! p8: parameter 2130706433 = 127.0.0.1 (loopback) -- not a usable upstream PE
! address, must fall back to the extended community.
route-map rm-p8 permit 10
 set large-community 65010:1:2130706433
 set extcommunity rt 10.9.9.9:0
!
! p9: function 2 != the configured code point 1 -- the tuple must be skipped
! (wrong function) and resolution fall back to the extended community.
route-map rm-p9 permit 10
 set large-community 65010:2:184549374
 set extcommunity rt 10.9.9.9:0
!
! p10: parameter 4294967295 = 255.255.255.255 (limited broadcast, Class E) --
! not a usable upstream PE address. This is the reject ipv4_unicast_valid()
! let through (240/4 is "usable unicast" to it); the explicit Class E gate
! must reject it and fall back to the extended community.
route-map rm-p10 permit 10
 set large-community 65010:1:4294967295
 set extcommunity rt 10.9.9.9:0
!
! p11: parameter 4026531841 = 240.0.0.1 (Class E, non-broadcast) -- same gap,
! the generic 240/4 case; must fall back to the extended community.
route-map rm-p11 permit 10
 set large-community 65010:1:4026531841
 set extcommunity rt 10.9.9.9:0
!
! p12: parameter 2851995649 = 169.254.0.1 (link-local, 169.254/16). Interface
! scoped and not globally unique, so as a UMH it either names nothing
! reachable or collides with a different box on some other link; must fall
! back to the extended community.
route-map rm-p12 permit 10
 set large-community 65010:1:2851995649
 set extcommunity rt 10.9.9.9:0
!
! p13: parameter 1 = 0.0.0.1 -- inside 0/8 but NOT zero. Pins the gate to the
! IPV4_NET0() prefix test: a revert to a bare `param == 0` check would still
! reject p7 (0.0.0.0) and so stay green without this vector.
route-map rm-p13 permit 10
 set large-community 65010:1:1
 set extcommunity rt 10.9.9.9:0
!

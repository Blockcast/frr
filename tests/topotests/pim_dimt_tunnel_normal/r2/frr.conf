! r2: the receiver PoP.  pimd requests a DIMT tunnel toward r1's UMH across
! r3; the static IGMP membership that creates demand is added by the test so
! each stage can time the join from a known instant.
!
! `pim-mode normal` is the subject of this suite: the dimt-* netdev pimd
! builds runs ordinary PIM, sends hellos, forms a real adjacency with r1, and
! addresses its Join/Prune to that adjacency rather than to the UMH loopback.
!
debug pim trace
debug pim packets hello
debug pim zebra
debug zebra dplane
!
interface r2-eth0
 ip address 10.0.2.2/24
!
interface r2-eth1
 ip address 10.20.20.1/24
 ip pim passive
 ip igmp
!
ip route 10.0.1.0/24 10.0.2.1
ip route 10.255.0.0/24 10.0.2.1
!
! No route to 10.77.0.0/24 and none to 10.99.0.0/24, on purpose: the UMH is
! reachable only over the tunnel, and r1's tunnel link address must never be
! resolvable any other way.
dimt tunnel-endpoint 10.77.0.1 inner-local 10.99.0.2 outer-local 10.0.2.2 outer 10.255.0.1 encap gre pim-mode normal
!
router bgp 65002
 bgp router-id 10.0.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 ebgp-multihop 3
 neighbor 10.0.1.1 update-source 10.0.2.2
! r1 originates SOURCE's prefix and stamps the UMH EC on it; the EC is
! honoured only from a dimt-trusted neighbor (BLO-36553).
 neighbor 10.0.1.1 dimt-trusted
 address-family ipv4 unicast
 exit-address-family
!

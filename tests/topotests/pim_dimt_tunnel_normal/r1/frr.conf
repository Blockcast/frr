! r1: the upstream PE and UMH, two underlay hops from r2 (via r3).
!
! The UMH side of the tunnel is a static GRE netdev created by the test
! (gre-n) running NORMAL PIM -- no `ip pim light` -- which is the whole point
! of this suite.  It stands in for a vendor UMH: Junos and EOS both require a
! hello adjacency before they will accept a Join/Prune at all.
!
! THE ADDRESSING IS THE EXPERIMENT, so do not "tidy" it:
!
!   UMH (settlement identity) .. 10.77.0.1, a loopback, on NO link
!   gre-n link address ........ 10.99.0.1, peer 10.99.0.2 (r2's inner-local)
!
! They are deliberately different addresses.  In the sibling
! pim_dimt_tunnel_jp suite the UMH *is* the tunnel's ptp local address, so a
! Join addressed to the UMH and a Join addressed to the adjacency are
! indistinguishable on the wire -- which is exactly why that suite could not
! have caught the lab's Junos silent drop (T1c-1/T1c-3).  Here the two differ,
! so F9 can assert which one the Join actually carries.
!
! The short hello period/holdtime is for F10: it makes a neighbour expiry
! observable in seconds instead of the 105 s the 30 s default implies.  Real
! time on a capacity-constrained CI shard is the scarce resource here.
!
debug pim trace
debug pim packets hello
debug pim packets joins
!
interface lo
 ip address 10.255.0.1/32
 ip address 10.77.0.1/32
!
interface r1-eth0
 ip address 10.0.1.1/24
!
interface r1-eth1
 ip address 10.10.10.1/24
 ip pim
!
interface gre-n
 ip pim
 ip pim hello 2 6
!
ip route 10.0.2.0/24 10.0.1.2
!
router bgp 65001
 bgp router-id 10.0.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 ebgp-multihop 3
 neighbor 10.0.2.2 update-source 10.0.1.1
 address-family ipv4 unicast
  redistribute connected route-map UMH
 exit-address-family
!
! Only the source prefix is advertised, and neither the UMH nor the tunnel
! link subnet is: r2 must reach the UMH solely through its DIMT tunnel, and
! must never learn 10.99.0.1 by any route.
ip prefix-list SRC seq 5 permit 10.10.10.0/24
!
route-map UMH permit 10
 match ip address prefix-list SRC
 set extcommunity umh 10.77.0.1 pim preference 5
!

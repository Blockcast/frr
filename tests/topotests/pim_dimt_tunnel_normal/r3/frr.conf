! r3: a plain transit router on the underlay.  No PIM, no BGP: it only
! forwards, and in doing so decrements the tunnel's outer TTL -- which is the
! whole reason it exists in this topology.
interface r3-eth0
 ip address 10.0.1.2/24
!
interface r3-eth1
 ip address 10.0.2.1/24
!
ip route 10.255.0.0/24 10.0.1.1
!
ip forwarding
!

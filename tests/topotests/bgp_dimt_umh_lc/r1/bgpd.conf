!
! r1: AS 65001.  Starts by originating ONE route, the LC-only 10.10.1.0/24;
! each later stage adds its own prefix at runtime so that the reject counter
! on r2 moves by an exact, attributable amount.
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 timers 3 10
 neighbor fd00:12::2 remote-as 65002
 neighbor fd00:12::2 timers 3 10
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
  network 10.10.1.0/24 route-map LC-OK
 exit-address-family
 address-family ipv6 unicast
  neighbor fd00:12::2 activate
 exit-address-family
!
! <origin AS>:<function>:<UMH IPv4 as u32>.  184549374 == 10.255.255.254.
route-map LC-OK permit 10
 set large-community 65001:1:184549374
!
! Global Administrator 65009 is not the origin AS (65001).
route-map LC-GA permit 10
 set large-community 65009:1:184549374
!
! 3758096385 == 224.0.0.1: multicast, never a usable UMH.
route-map LC-BAD permit 10
 set large-community 65001:1:3758096385
!
! The LC and an amt-relay EC naming the same address: the EC must win.
route-map LC-AMT permit 10
 set large-community 65001:1:184549374
 set extcommunity umh 10.255.255.254 amt-relay preference 5
!
! The LC and a pim EC naming another address: the LC must win.
route-map LC-PIMEC permit 10
 set large-community 65001:1:184549374
 set extcommunity umh 10.99.0.1 pim preference 5
!
! Function 7: off the DIMT lane while r2 decodes function 1.
route-map LC-FN7 permit 10
 set large-community 65001:7:184549374
!

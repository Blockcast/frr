!
! r1 -- the source PE.  Originates every test prefix with `network ...
! route-map`, so each stage adds exactly the route it measures.
!
! lo carries the UMH address the large community names (184549374 ==
! 10.255.255.254), so the mapping points at something real.
interface lo
 ip address 10.255.255.254/32
!
! s1: the eBGP sessions to r2 (one IPv4, one IPv6).
interface r1-eth0
 ip address 10.0.0.1/24
 ipv6 address fd00:12::1/64
!
ip forwarding
ipv6 forwarding
!

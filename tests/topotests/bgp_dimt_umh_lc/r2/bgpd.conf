!
! r2 -- the receiver PoP, and the box under test.
!
! Both sessions to r1 are `dimt-trusted` from the start: this suite is about
! the UMH LARGE community lane, and stage 1 needs it to be able to pin.  The
! trust gate's own default-deny is bgp_dimt_umh_trust's job; the last stage
! here only checks that revoking trust takes an LC mapping away the way it
! takes an EC one.
!
! `debug bgp zebra` makes the LC-vs-EC disagreement line visible (stage 4).
!
debug bgp zebra
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp dimt umh-large-community 1
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 neighbor 10.0.0.1 dimt-trusted
 neighbor fd00:12::1 remote-as 65001
 neighbor fd00:12::1 timers 3 10
 neighbor fd00:12::1 dimt-trusted
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
 exit-address-family
 address-family ipv6 unicast
  neighbor fd00:12::1 activate
 exit-address-family
!

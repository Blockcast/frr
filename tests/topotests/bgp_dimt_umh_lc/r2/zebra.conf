!
! s1: the eBGP sessions to r1.  `ip pim light` so that an honoured UMH has a
! candidate interface to resolve onto, as in bgp_dimt_umh_trust.
interface r2-eth0
 ip address 10.0.0.2/24
 ipv6 address fd00:12::2/64
 ip pim light
!
! s3: receiver stub.
interface r2-eth1
 ip address 10.20.20.1/24
!
ip forwarding
ipv6 forwarding
!

!
debug zebra events
!
! lo carries the UMH.  It is deliberately NOT on any segment r2 is
! connected to: the UMH must be reachable only over the tunnel, so that on
! r2 the DIMT netdev is the ONLY interface whose connected prefix covers it
! (see the header comment in test_pim_dimt_forwarding_events.py).
interface lo
 ip address 10.99.0.1/32
!
! s1: underlay for the GRE outer, and the eBGP session.
interface r1-eth0
 ip address 10.0.0.1/24
!
! s2: the source LAN (h1).
interface r1-eth1
 ip address 10.10.10.1/24
!
ip forwarding
!

!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 timers 3 10
 address-family ipv4 unicast
  redistribute connected route-map UMH1
 exit-address-family
 !
 ! The far end of r2's MVPN session.  r2 needs a peer activated under an
 ! MCAST_VPN AF before its bgpd subscribes to zebra's pimd join relay (see
 ! r2/bgpd.conf for the full chain); the capability only negotiates if both
 ! ends activate, so r1 carries the matching stanza.  Mirrors
 ! bgp_mvpn_gtm_events/r1/bgpd.conf.
 address-family ipv4 mvpn
  neighbor 10.0.0.2 activate
 exit-address-family
!
! The UMH points at r1's loopback, NOT at its s1 address.  r2 has no
! connected route covering 10.99.0.1, so nothing on r2 can resolve a pin
! toward it until the DIMT netdev exists and carries 10.99.0.1 as its
! point-to-point peer.  Same reasoning as pim_dimt_tunnel/r1/bgpd.conf.
ip prefix-list SRC seq 5 permit 10.10.10.0/24
!
! TWO route-maps, differing only in the UMH they attach, so the origin-change
! stage can switch the announced upstream with a single
! `redistribute connected route-map UMH2` -- re-running redistribution without
! ever withdrawing 10.10.10.0/24.  A `no redistribute` / `redistribute` pair
! would withdraw the source route in between, and r2 would see the join lose
! its UMH entirely (a withdraw, or an origin_change to no-upstream) rather than
! the clean origin change this suite is pinning down.
!
! 10.99.0.9 is deliberately NOT configured anywhere and r2 has no
! `dimt tunnel-endpoint` row for it.  That is the point: per D3 "Origin
! change", forwarding_ready for the new path must not appear until that path
! reaches FWD_READY, and a UMH with no endpoint row never does.  The stage
! therefore proves the negative from a path that structurally cannot become
! ready, instead of racing a timeout against one that might.
!
! EACH map attaches the SAME upstream under TWO encodings, because two
! independent consumers read two different attributes and NEITHER reads the
! other's:
!
!   `extcommunity umh` -> IP-address-specific EC, subtype ECOMMUNITY_UMH
!     (0x80, bgp_ecommunity.h:83).  The DIMT RPF-steering hint; PIMD is its
!     only consumer.  It is what pins (S,G) onto the dimt netdev and makes
!     `show ip pim dimt umh` resolve.
!
!   `extcommunity rt <UMH>:0` -> IP-address-specific ROUTE_TARGET (0x02), the
!     RFC 7716 Section 2.2 upstream-node-identifying RT whose Global
!     Administrator is the upstream PE.  BGPD is its consumer:
!     bgp_mvpn_resolve_from_ecommunity() reads VRF_ROUTE_IMPORT (0x0b) then
!     ROUTE_TARGET (0x02) and NOTHING else -- subtype 0x80 is invisible to it
!     (BLO-29577).
!
! Supplying only the DIMT EC does not merely drop `upstream_peer` from the
! records; it makes the ORIGIN-CHANGE STAGE UNSATISFIABLE, which is why this
! RT is required rather than cosmetic.  bgp_mvpn_events.c:1000 computes
!
!     changed = !is_new && (last_source_as != source_as ||
!                           last_umh.s_addr != umh.s_addr)
!
! and returns early when !is_new && !changed.  With 0x80 alone, `umh` is
! INADDR_ANY both before and after the UMH1->UMH2 swap, and source_as is the
! local AS both times (no Source-AS EC), so `changed` is false: NO
! origin_change and NO forwarding_lost are emitted at all, and D6's "UMH
! origin change" verifying signal cannot be produced.  With the RT the
! upstream genuinely moves 10.99.0.1 -> 10.99.0.9, so the interval closes and
! re-opens exactly as D3 "Origin change" describes.
!
! It is transitive (val[0] = ECOMMUNITY_ENCODE_IP = 0x01, no non-transitive
! flag), so it crosses the eBGP 65001<->65002 session -- unlike sibling
! bgp_mvpn_gtm_events, which is iBGP.  The 0x80 EC above uses the same encode
! type and already traverses this session to reach pimd, which is the
! empirical proof that this one does too.
route-map UMH1 permit 10
 match ip address prefix-list SRC
 set extcommunity umh 10.99.0.1 pim preference 5
 set extcommunity rt 10.99.0.1:0
!
route-map UMH1 permit 20
!
route-map UMH2 permit 10
 match ip address prefix-list SRC
 set extcommunity umh 10.99.0.9 pim preference 5
 set extcommunity rt 10.99.0.9:0
!
route-map UMH2 permit 20
!

!
debug pim trace
debug pim zebra
!
! `mvpn-gtm` makes the upstream gtm-announced, which is what drives
! pim_gtm_forwarding_update() -- and therefore the readiness edges this
! suite asserts -- for SSM groups.
router pim
 mvpn-gtm
!
! The explicit D2 endpoint row for the FIRST UMH.  There is deliberately no
! row for 10.99.0.9 (the origin-change target): see r1/bgpd.conf.
dimt tunnel-endpoint 10.99.0.1 inner-local 10.99.0.2 outer-local 10.0.0.2 outer 10.0.0.1 encap gre
!
! Receiver stub.  NOTE the difference from pim_dimt_tunnel/r2/pimd.conf: there
! is NO `ip igmp static-group` here.  pim_dimt_tunnel joins at startup, which
! is fine when the evidence is kernel state -- kernel state is still there when
! you look.  An event stream is not: a reader only sees what is emitted after
! it connects, so a startup join puts `install` behind the reader and the
! install-before-forwarding_ready ordering could then only be inferred from a
! snapshot, which is exactly the framing that does NOT carry readiness.  The
! membership is configured at runtime instead, after the reader is attached,
! by _membership() in the test -- which uses `ip igmp join-group`, NOT
! `static-group`.  A runtime `static-group` is silently a no-op when its one
! attempt misses: static_group_join() defers on an unready VIF or a refused
! tib_sg_gm_join() and leaves the retry to pim_if_static_group_replay(), which
! only runs on interface-up / neighbor-add.  See _membership()'s docstring.
interface r2-eth1
 ip pim passive
 ip igmp
!

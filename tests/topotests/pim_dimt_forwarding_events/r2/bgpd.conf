!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 address-family ipv4 unicast
 exit-address-family
!
! `bgp mvpn event-socket` is deliberately NOT in this file.  The socket path
! has to be unique per test run (it carries the pid), and -- more importantly
! -- the listener must come up AFTER this suite's reader is ready to connect
! but BEFORE the join, so that the whole (S,G) lifecycle lands on the live
! stream rather than being replayed as a snapshot.  test_event_socket_connects
! configures it at runtime, the same way bgp_mvpn_gtm_events does.
!

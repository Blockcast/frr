!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 address-family ipv4 unicast
 exit-address-family
 !
 ! REQUIRED for this suite to see anything at all, and the reason is not
 ! obvious: it is what makes bgpd SUBSCRIBE to pimd's join relay.
 !
 ! bgpd only calls bgp_zebra_mvpn_sg_subscribe() when bgp_mvpn_gtm_active()
 ! is true (bgp_zebra.c), and that is defined as "a peer is activated under
 ! an MCAST_VPN address-family" (bgp_mvpn.c:1446-1450).  Until it fires,
 ! zebra never sets ZEBRA_BGP_WANTS_MVPN_SG and DROPS every MVPN_SG relay
 ! from pimd on the floor (zapi_msg.c:4155-4161) -- so no Type-7 is ever
 ! originated and the settlement stream stays empty forever.
 !
 ! It fails SILENTLY and PERMANENTLY: pimd sets up->gtm_announced = true
 ! unconditionally right after the send, and the GTM reconcile is
 ! edge-triggered (`desired && !gtm_announced`, pim_zebra.c:557), so nothing
 ! ever re-announces the dropped join.  pim_dimt_tunnel/ does not need this
 ! because it asserts kernel + pimd state and never reads bgpd's stream;
 ! this is the first suite to assert the stream, so it is the first to need
 ! the subscription.  Mirrors bgp_mvpn_gtm_events/r1/bgpd.conf.
 address-family ipv4 mvpn
  neighbor 10.0.0.1 activate
 exit-address-family
!
! `bgp mvpn event-socket` is deliberately NOT in this file.  The socket path
! has to be unique per test run (it carries the pid), and -- more importantly
! -- the listener must come up AFTER this suite's reader is ready to connect
! but BEFORE the join, so that the whole (S,G) lifecycle lands on the live
! stream rather than being replayed as a snapshot.  test_event_socket_connects
! configures it at runtime, the same way bgp_mvpn_gtm_events does.
!

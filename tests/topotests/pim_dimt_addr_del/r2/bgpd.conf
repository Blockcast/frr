!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
! r1 originates the source prefix and stamps the UMH EC; the EC is honoured
! only from a dimt-trusted neighbor (BLO-36553).
 neighbor 10.0.0.1 dimt-trusted
 address-family ipv4 unicast
 exit-address-family
!

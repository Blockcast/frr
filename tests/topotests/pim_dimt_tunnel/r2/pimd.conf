!
debug pim trace
debug pim zebra
!
! `mvpn-gtm` makes the upstream gtm-announced, which is what drives
! pim_gtm_forwarding_update() -- and therefore the readiness edges this
! suite asserts -- for SSM groups.
router pim
 mvpn-gtm
!
! The explicit D2 endpoint row.  Every value is stated: there is no
! wildcard, no default, and deliberately no 10.99->100.64 arithmetic.  The
! inner peer is not written here because it IS the UMH (the row key).
dimt tunnel-endpoint 10.99.0.1 inner-local 10.99.0.2 outer-local 10.0.0.2 outer 10.0.0.1 encap gre
!
! Receiver stub.  The static group creates the (S,G) upstream without
! needing data-plane traffic, so the MFC entry -- and with it the kernel
! admission this suite asserts -- appears from control plane alone.
interface r2-eth1
 ip pim passive
 ip igmp
 ip igmp static-group 232.1.1.10 10.10.10.10
!

!
debug zebra events
debug zebra dplane
!
! s1: underlay for the GRE outer, and the eBGP session.
!
! NOTE -- r2-eth0 is deliberately NOT `ip pim light` here, so that for most of
! the suite the DIMT netdev is the only pin candidate and each stage tests the
! state machine rather than pin resolution.  The final stage
! (test_covering_light_interface_does_not_shadow_the_tunnel) adds a covering
! address plus `ip pim light` to this interface at runtime, on purpose, to prove
! the tunnel wins that contest deterministically (BLO-27869).
interface r2-eth0
 ip address 10.0.0.2/24
!
! s3: receiver stub, where the IGMP membership lives.
interface r2-eth1
 ip address 10.20.20.1/24
!
ip forwarding
!

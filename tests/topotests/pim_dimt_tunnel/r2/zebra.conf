!
debug zebra events
debug zebra dplane
!
! s1: underlay for the GRE outer, and the eBGP session.
!
! NOTE -- r2-eth0 is deliberately NOT `ip pim light`.  pim_dimt_light_iface()
! returns the FIRST pim-light interface whose connected address or
! point-to-point destination prefix-matches the UMH.  A light interface
! whose subnet happens to cover the UMH would therefore shadow the DIMT
! netdev, the RPF pin would land on the wrong interface, and readiness
! conjunct (2) -- rpf interface == tunnel ifindex -- could never hold.
! Keeping the underlay out of pim-light makes the tunnel the only candidate.
interface r2-eth0
 ip address 10.0.0.2/24
!
! s3: receiver stub, where the IGMP membership lives.
interface r2-eth1
 ip address 10.20.20.1/24
!
ip forwarding
!

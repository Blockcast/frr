!
! p1: carries BOTH the RFC 7716 route-target (the RT lane) and the DIMT
! ECOMMUNITY_UMH 0x80 (the attestation lane), and they name DIFFERENT
! addresses on purpose -- 10.0.0.2 is r2's MVPN PE identity, 10.99.0.1 is a
! PIM-Light/AMT-relay tunnel endpoint. Every interesting assertion in this
! suite turns on that divergence.
!
route-map dimt permit 10
 set extcommunity rt 10.0.0.2:0
 set extcommunity umh 10.99.0.1 pim preference 5
!
! p2: RT only. Its events must be byte-identical to pre-fix behaviour --
! this is the "do not regress what is already correct" control.
!
route-map rtonly permit 10
 set extcommunity rt 10.0.0.2:0
!
router bgp 65001
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  network 10.10.10.0/24 route-map dimt
  network 10.10.20.0/24 route-map rtonly
 exit-address-family
 address-family ipv4 mvpn
  neighbor 10.0.0.1 activate
 exit-address-family
!

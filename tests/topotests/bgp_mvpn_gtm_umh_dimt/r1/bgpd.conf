!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.0.2 remote-as 65001
! r2 originates 10.10.10.0/24 with the 0x80 UMH EC.  The EC is honoured only
! from a dimt-trusted neighbor (BLO-36553); this session is iBGP, so the
! origin-AS arm of that gate is satisfied by being inside our own AS.
 neighbor 10.0.0.2 dimt-trusted
 neighbor 10.0.0.2 timers 3 10
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
 exit-address-family
 address-family ipv4 mvpn
  neighbor 10.0.0.2 activate
  bgp mvpn ipmsi-label 100
 exit-address-family
!

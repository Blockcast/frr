!
debug bgp zebra
route-map rtimport permit 10
 set extcommunity rt 10.255.0.2:0
!
route-map vri permit 10
 set extcommunity vrf-route-import 10.255.0.3:0
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 timers 3 10
 address-family ipv4 unicast
  network 10.10.10.0/24
  network 10.99.99.1/32 route-map rtimport
  network 10.99.99.2/32 route-map vri
 exit-address-family
 address-family ipv4 mvpn
  neighbor 10.0.0.2 activate
  bgp mvpn source-active 10.10.10.1 group 232.1.1.1
  bgp mvpn source-active 10.99.99.1 group 232.9.9.9
  bgp mvpn source-active 10.99.99.2 group 232.9.9.10
 exit-address-family
 address-family ipv6 mvpn
  neighbor 10.0.0.2 activate
  bgp mvpn source-active 2001:db8::1 group ff3e::1
 exit-address-family
!

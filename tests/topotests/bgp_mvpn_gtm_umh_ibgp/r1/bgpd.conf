!
router bgp 65001
 bgp router-id 10.40.0.1
 no bgp network import-check
 ! Required for this suite: FRR sets reject_as_sets=true in bgp_create(), so
 ! by default an AS_SET-bearing path is treated-as-withdraw at attribute parse
 ! and never reaches the UMH resolver. That default is real defense in depth,
 ! but it is a separate, operator-toggleable knob -- the resolver's own trust
 ! decision must not depend on it, which is exactly what this suite pins.
 no bgp reject-as-sets
 bgp mvpn umh-large-community 1
 neighbor 10.40.0.2 remote-as 65001
 neighbor 10.40.0.2 timers 3 10
 address-family ipv4 unicast
  neighbor 10.40.0.2 activate
 exit-address-family
 address-family ipv4 mvpn
  neighbor 10.40.0.2 activate
 exit-address-family
!

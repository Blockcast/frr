!
debug pim trace
debug pim zebra
!
router pim
 mvpn-gtm
!
! The endpoint row starts WITHOUT `protect ipsec`: the first stages prove
! the attack this exists for (cleartext GRE from a spoofed outer reaches the
! netdev) and that the kernel's inbound check stops it once a policy is in
! place.  The knob itself is added at runtime.
dimt tunnel-endpoint 10.99.0.1 inner-local 10.99.0.2 outer-local 10.0.0.2 outer 10.0.0.1 encap gre
!
interface r2-eth1
 ip pim passive
 ip igmp
 ip igmp static-group 232.1.1.10 10.10.10.10
!

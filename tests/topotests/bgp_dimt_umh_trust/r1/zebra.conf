!
! r1 -- the source PE.  Originates 10.10.10.0/24 and stamps the DIMT UMH
! extended community on it.
!
! lo carries the UMH address itself.
interface lo
 ip address 10.99.0.1/32
!
! s1: the eBGP session to r2.
interface r1-eth0
 ip address 10.0.0.1/24
!
! s2: the source LAN.
interface r1-eth1
 ip address 10.10.10.1/24
!
ip forwarding
!

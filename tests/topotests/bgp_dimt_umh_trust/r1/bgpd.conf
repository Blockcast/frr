!
! r1: AS 65001, originates the source prefix and stamps the UMH EC.
!
! The suite mutates the OUTBOUND side of this session at runtime to move the
! route's origin AS (see test_origin_as_mismatch_is_rejected); nothing else
! about r1 changes.
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 timers 3 10
 address-family ipv4 unicast
  redistribute connected route-map UMH
 exit-address-family
!
ip prefix-list SRC seq 5 permit 10.10.10.0/24
!
route-map UMH permit 10
 match ip address prefix-list SRC
 set extcommunity umh 10.99.0.1 pim preference 5
!
route-map UMH permit 20
!

!
! s1: the eBGP session to r1.  `ip pim light` so that a honoured UMH has a
! candidate interface to resolve onto -- without it an accepted mapping would
! land unresolved and the accept/refuse distinction would be muddier than it
! needs to be.
interface r2-eth0
 ip address 10.0.0.2/24
 ip pim light
!
! s3: receiver stub.
interface r2-eth1
 ip address 10.20.20.1/24
!
ip forwarding
!

!
! r2 -- the receiver PoP, and the box under test.
!
! NOTE: 10.0.0.1 is deliberately NOT `dimt-trusted` in the startup config.
! Stage 1 asserts the DEFAULT, which is deny: an unmarked neighbor's UMH
! extended community is ignored and counted.  Stage 2 adds the knob at
! runtime.
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 address-family ipv4 unicast
 exit-address-family
!

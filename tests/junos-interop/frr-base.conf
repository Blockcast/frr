! FRR side of the Junos GTM-SSM MVPN interop matrix (BLO-15579).
!
! Shape follows tests/topotests/bgp_mvpn_gtm/r1+r2 -- the FRR<->FRR cells that
! already pass -- so a Junos-side failure is attributable to interop and not to
! a novel FRR config.  Differences from the topotest, all forced by running one
! speaker in a container instead of a two-router netns topology:
!
!   * rx0 is a dummy receiver stub, created by the harness.  `ip igmp join-group`
!     / `ipv6 mld join-group` land there, so joins never touch the lab host.
!     `ip igmp` / `ipv6 mld` on rx0 are REQUIRED, not decoration: join-group only
!     needs pim_ifp, so without them the command is accepted and even issues a
!     socket join, but pim_if_membership_refresh() returns early on !gm_enable
!     (pimd/pim_nb_config.c) and the join never becomes local membership.  FRR
!     would never reach JOINED, originate no Type-7, and six cells would fail for
!     a reason that is not interop.  bgp_mvpn_gtm/r2/pimd.conf pairs them too.
!   * The (S,G) source RPFs out eth0 toward the container gateway, which is the
!     path to the Junos.  There is deliberately NO PIM adjacency to the Junos:
!     GTM's neigh_needed=false path is the thing under test, and the join must
!     cross as BGP or not at all.
!   * @@PLACEHOLDER@@ tokens are substituted by mvpn-gtm-interop.sh.
!
frr defaults traditional
hostname frr-blo15579
log stdout informational
!
debug bgp updates
debug bgp zebra
debug pim zebra
!
interface eth0
 ip pim
 ip pim passive
 ipv6 pim
 ipv6 pim passive
!
interface rx0
 ip address @@RX_V4@@
 ipv6 address @@RX_V6@@
 ip pim
 ip pim passive
 ip igmp
 ipv6 pim
 ipv6 pim passive
 ipv6 mld
!
! RPF for the C-S toward the Junos.  Without this pimd never reaches JOINED and
! no Type-7 is originated -- which would look like an interop failure and is not.
ip route @@V4_SRC@@/32 @@GW_V4@@
ipv6 route @@V6_SRC@@/128 eth0
!
router bgp @@AS@@
 bgp router-id @@FRR_RID@@
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor @@JUNOS_RID@@ remote-as @@AS@@
 neighbor @@JUNOS_RID@@ timers 10 30
 address-family ipv4 unicast
  neighbor @@JUNOS_RID@@ activate
 exit-address-family
 address-family ipv6 unicast
  neighbor @@JUNOS_RID@@ activate
 exit-address-family
 address-family ipv4 mvpn
  neighbor @@JUNOS_RID@@ activate
 exit-address-family
 address-family ipv6 mvpn
  neighbor @@JUNOS_RID@@ activate
 exit-address-family
!
router pim
 mvpn-gtm
!
router pim6
 mvpn-gtm
!
